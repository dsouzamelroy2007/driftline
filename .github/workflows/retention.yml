name: Retention

# A dedicated check for docs/RETENTION.md's core guarantee, separate from the general ci.yml
# lint/typecheck/test/build job — see docs/ROADMAP.md's Phase 9 line. This job runs only the
# retention-specific suites (the Phase 3 exit gate proving zero message bodies survive once every
# recipient has acked, plus the Phase 8 retention-monitor compliance check) against a real
# Postgres, so a break in the retention contract itself shows up as its own named, unmissable
# check rather than being buried among every other server test.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  retention:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: driftline
          POSTGRES_PASSWORD: driftline
          POSTGRES_DB: driftline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U driftline -d driftline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://driftline:driftline@localhost:5432/driftline_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @driftline/db db:migrate

      # @driftline/db resolves to its compiled dist (see packages/db/package.json), so it needs a
      # real build before apps/server can import it — same reason ci.yml's `test` task depends on
      # `^build` under turbo. Only @driftline/db needs building: vitest transpiles apps/server's
      # own TS source directly, it isn't imported as a compiled package by anything here.
      - run: pnpm turbo run build --filter=@driftline/db

      # Filename-pattern filter, not the whole apps/server suite — ci.yml's `test` job already
      # covers everything else. Matches retention.integration.test.ts (ack/expiry/revocation purge
      # paths) and retention-monitor.test.ts (the Phase 8 compliance check).
      - run: pnpm --filter @driftline/server exec vitest run retention
