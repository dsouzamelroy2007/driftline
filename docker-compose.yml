services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: driftline
      POSTGRES_PASSWORD: driftline
      POSTGRES_DB: driftline_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftline -d driftline_test"]
      interval: 5s
      timeout: 5s
      retries: 10
